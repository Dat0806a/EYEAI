[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# 1. API TTS Audio Proxy for Chrome & Safari (Netlify Serverless Function)
[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true

# 2. SPA Fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Accept-Ranges = "bytes"
    Content-Type = "video/mp4"
    Access-Control-Allow-Origin = "*"
