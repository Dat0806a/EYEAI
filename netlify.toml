[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# 1. API Patient Autonomous Agent Endpoints (must precede /api/patient/*)
[[redirects]]
  from = "/api/patient/agent/*"
  to = "/.netlify/functions/patient-agent"
  status = 200
  force = true

[[redirects]]
  from = "/api/patient/agent"
  to = "/.netlify/functions/patient-agent"
  status = 200
  force = true

# 2. API Patient Endpoints (Netlify Serverless Function)
[[redirects]]
  from = "/api/patient/*"
  to = "/.netlify/functions/patient"
  status = 200
  force = true

# 2. API AI Chat Endpoints
[[redirects]]
  from = "/api/ai/chat"
  to = "/.netlify/functions/ai-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/gemini/chat"
  to = "/.netlify/functions/ai-chat"
  status = 200
  force = true

# 2.5 API Entertainment YouTube Search (Netlify Serverless Function)
[[redirects]]
  from = "/api/entertainment/search"
  to = "/.netlify/functions/entertainment-search"
  status = 200
  force = true

# 3. API TTS Audio Proxy for Chrome & Safari (Netlify Serverless Function)
[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true

# 4. SPA Fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://maps.googleapis.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=()"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Accept-Ranges = "bytes"
    Content-Type = "video/mp4"
    Access-Control-Allow-Origin = "*"
